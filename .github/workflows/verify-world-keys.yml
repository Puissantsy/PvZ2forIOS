name: Active world-key conversion policy and ARM tail-call checks (no IPA)
on:
  push:
    branches: [research/world-key-conversion-active]
    paths:
      - ".github/workflows/verify-world-keys.yml"
      - "tests/staging/world_key_*"
      - "tests/staging/test_world_key_*"
      - "tests/staging/test_readonly_rton_save.py"
      - "tools/inspect_pvz2_rton_save.py"
      - "tests/staging/test_keyconv_rton_memory.py"
      - "tools/experimental_keyconv_rton_memory.py"
      - "tests/staging/test_keyconv_rton_archive.py"
      - "tools/experimental_keyconv_rton_archive.py"
      - "tools/experimental_keyconv_prelaunch.py"
      - "tests/staging/test_keyconv_prelaunch.py"
      - "tests/staging/test_keyconv_rton_native.py"
      - "tests/staging/keyconv_rton_native_cli.cpp"
      - "tests/staging/keyconv_prelaunch_ios_adapter.hpp"
      - "tests/staging/keyconv_prelaunch_ios_adapter.mm"
      - "tools/verify_keyconv_offline_export.py"
      - "tools/verify_keyconv_ios_integration.py"
      - "tools/verify_world_key_*"
      - "tools/verify_keyobs_restore_wiring.py"
      - "tools/verify_ios_dynarmic_wiring.py"
      - "platform/ios/CMakeLists.txt"
      - ".github/workflows/build-ios-probe.yml"
      - "platform/ios/src/pvz2_apk_probe.hpp"
      - "platform/ios/src/pvz2_apk_probe.cpp"
      - "platform/ios/src/main.mm"
      - "platform/ios/src/save_backups.hpp"
      - "platform/ios/src/save_backups.mm"
      - "platform/ios/src/pvz2_apk_probe_parts/part_0*.inc"
  workflow_dispatch:

jobs:
  policy-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test isolated world-key eligibility policy
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -Itests/staging tests/staging/test_world_key_conversion_policy.cpp -o /tmp/world_key_policy_test
          /tmp/world_key_policy_test
      - name: Compile and test isolated read-only native event decoder
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -Itests/staging tests/staging/test_world_key_event_view.cpp -o /tmp/world_key_event_test
          /tmp/world_key_event_test
      - name: Compile and test native WorldSpecificKeys stock decoder
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Itests/staging tests/staging/test_world_key_stock_view.cpp -o /tmp/world_key_stock_view_test
          /tmp/world_key_stock_view_test
      - name: Compile and test read-only existing-world-key reconciliation plans
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Itests/staging tests/staging/test_world_key_stock_reconcile.cpp -o /tmp/world_key_stock_test
          /tmp/world_key_stock_test
      - name: Compile and exercise interrupted single-save journal (research only)
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-sanitize-recover=all -Itests/staging tests/staging/test_world_key_save_journal.cpp -o /tmp/world_key_save_journal_test
          /tmp/world_key_save_journal_test
      - name: Compile and test multi-file crash-recoverable save bundle (research only)
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-sanitize-recover=all -Itests/staging tests/staging/test_world_key_save_bundle_journal.cpp -o /tmp/world_key_save_bundle_test
          /tmp/world_key_save_bundle_test
      - name: Test exact KEYCONV native profile file write-set whitelist
        run: |
          clang++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Itests/staging tests/staging/test_world_key_save_write_observer.cpp -o /tmp/keyconv_v128_path_test
          /tmp/keyconv_v128_path_test
      - name: Test read-only PvZ2 RTON save inspector (synthetic data only)
        run: |
          python3 -m unittest discover -s tests/staging -p test_readonly_rton_save.py -v
      - name: Test isolated in-memory key-to-coin RTON token patch (no file writes)
        run: |
          python3 -m unittest discover -s tests/staging -p test_keyconv_rton_memory.py -v
      - name: Test disposable RTON ZIP experiment with manifest and no-overwrite guarantees
        run: |
          python3 -m unittest discover -s tests/staging -p test_keyconv_rton_archive.py -v
      - name: Test stopped-guest prelaunch journal and crash injection (synthetic only)
        run: python3 -m unittest discover -s tests/staging -p test_keyconv_prelaunch.py -v
      - name: Test native C++20 exact RTON token parity (synthetic only)
        run: python3 -m unittest discover -s tests/staging -p test_keyconv_rton_native.py -v
      - name: Compile and test native C++20 paired profile converter (synthetic only)
        run: |
          clang++ -std=c++20 -O1 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all -Itests/staging tests/staging/test_world_key_rton_native_pair.cpp -o /tmp/keyconv_native_pair_test
          /tmp/keyconv_native_pair_test
      - name: Compile and crash-test stopped-guest native SHA-256 two-image journal (no IPA)
        run: |
          clang++ -std=c++20 -O1 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-sanitize-recover=all -Itests/staging tests/staging/test_world_key_prelaunch_native.cpp -lcrypto -o /tmp/keyconv_native_prelaunch
          /tmp/keyconv_native_prelaunch
      - name: Verify nonempty-key ABI and divergent snapshot export isolation
        run: python3 tools/verify_keyconv_offline_export.py
      - name: Python syntax check (exact ELF stays private)
        run: |
          python3 -m py_compile tools/verify_world_key_arm.py tools/verify_world_key_award_coverage.py tools/verify_world_key_probe_wiring.py tools/verify_world_key_conversion_tailcall.py tools/inspect_pvz2_rton_save.py tools/experimental_keyconv_rton_memory.py tools/experimental_keyconv_rton_archive.py tools/experimental_keyconv_prelaunch.py
      - name: Check opt-in native probe integration (no IPA)
        run: python3 tools/verify_world_key_probe_wiring.py
      - name: Check active AddWorldKeys to native SetCoins tail-call (no IPA)
        run: python3 tools/verify_world_key_conversion_tailcall.py
      - name: Verify KEYCONV recovery/restore/opt-in/prelaunch wiring (no IPA)
        run: python3 tools/verify_keyconv_ios_integration.py
      - name: Check isolated KEYOBS save-transfer integration (no IPA)
        run: python3 tools/verify_keyobs_restore_wiring.py
      - name: Check exact public iOS Dynarmic source wiring (no IPA)
        run: python3 tools/verify_ios_dynarmic_wiring.py
      - name: Verify unproven multi-file journal is NOT wired to live iOS runtime
        run: python3 tools/verify_world_key_save_isolation.py
      - name: Verify KEYCONV native save V128 observer isolation
        run: python3 tools/verify_world_key_v128_observer.py
      - name: Check KEYCONV callback-memory startup fallback (no IPA)
        run: python3 tools/verify_world_key_dynarmic_compat.py

  dynarmic-exact-source-preflight:
    # Independent network/source preflight: NO iOS app compilation or IPA.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact public Dynarmic c97c Git commit and verify tree + historical patch
        shell: bash
        run: |
          set -euo pipefail
          DYN_URL="https://github.com/lioncash/dynarmic.git"
          DYN_SHA="c97c525ec1432b1e5404ebf091027738005ec168"
          DYN_TREE="fd5b3ab282948fcdacc202ee11ee6d7aec339125"
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone --no-tags "$DYN_URL" /tmp/pvz2-dynarmic-exact
          cd /tmp/pvz2-dynarmic-exact
          # The commit may be present in GitHub's object store but absent
          # from the repository's current advertised branch history.
          if ! git cat-file -e "$DYN_SHA^{commit}" 2>/dev/null; then
            echo "PVZ2_DYNARMIC_NOT_ADVERTISED_ATTEMPT_EXACT_FETCH=YES"
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch origin "$DYN_SHA"
          fi
          git checkout --detach "$DYN_SHA"
          git reset --hard "$DYN_SHA"
          test "$(git rev-parse HEAD)" = "$DYN_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$DYN_TREE"
          test ! -f .gitmodules
          test -f src/dynarmic/interface/A32/a32.h
          test -f src/dynarmic/interface/A32/config.h
          DUAL=externals/oaknut/include/oaknut/dual_code_block.hpp
          grep -Fq 'm_xmem = (std::uint32_t*)mmap(nullptr, size, PROT_READ | PROT_EXEC' "$DUAL"
          grep -Fq 'vm_remap(mach_task_self(), &wmem' "$DUAL"
          grep -Fq 'mprotect(m_wmem, size, PROT_READ | PROT_WRITE)' "$DUAL"
          grep -Fq 'if (DeviceHasTXM())' "$DUAL"
          grep -Fq 'JIT26PrepareRegion(m_xmem, m_size)' "$DUAL"
          git apply --check "$GITHUB_WORKSPACE/platform/ios/patches/dynarmic-ios-nontxm.patch"
          echo "PVZ2_DYNARMIC_EXACT_SOURCE_PREFLIGHT=PASS"
          echo "PVZ2_DYNARMIC_SOURCE_TREE=$DYN_TREE"

  apple-native-smoke:
    # Test native C++ on macOS and syntax-check iPadOS arm64. NEVER build IPA.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native journal tests using Apple CommonCrypto
        run: |
          clang++ -std=c++20 -O0 -g -Wall -Wextra -Werror -pedantic \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itests/staging tests/staging/test_world_key_prelaunch_native.cpp \
            -o /tmp/pvz2-keyconv-native-apple
          ASAN_OPTIONS=detect_leaks=0 /tmp/pvz2-keyconv-native-apple
      - name: Compile check research-only ObjC++ KEYCONV adapter on macOS
        run: |
          clang++ -std=c++20 -fobjc-arc -x objective-c++ -fsyntax-only \
            -Wall -Wextra -Werror -pedantic \
            -Itests/staging tests/staging/keyconv_prelaunch_ios_adapter.mm
      - name: Syntax-check same C++ code for iPadOS arm64 (NO IPA)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ -std=c++20 \
            -target arm64-apple-ios17.4 -isysroot "$SDK" \
            -fsyntax-only -Wall -Wextra -Werror -pedantic \
            -Itests/staging tests/staging/test_world_key_prelaunch_native.cpp
      - name: Syntax-check full UIKit launcher and v165 snapshot code for iPadOS arm64 (no Dynarmic)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          for unit in platform/ios/src/main.mm platform/ios/src/save_backups.mm; do
            xcrun --sdk iphoneos clang++ -std=c++20 \
              -target arm64-apple-ios17.4 -isysroot "$SDK" \
              -fobjc-arc -x objective-c++ -fsyntax-only \
              -Wall -Wextra -Wno-unused-parameter \
              -Iplatform/ios/src -Itests/staging "$unit"
          done
      - name: Compile actual iPadOS arm64 ObjC++ launcher adapter and restore object files (NO IPA)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p /tmp/pvz2-keyconv-ios-objects
          for unit in platform/ios/src/main.mm platform/ios/src/save_backups.mm platform/ios/src/keyconv_prelaunch_ios_adapter.mm; do
            base="$(basename "$unit" .mm)"
            xcrun --sdk iphoneos clang++ -std=c++20 -O1 \
              -target arm64-apple-ios17.4 -isysroot "$SDK" \
              -fobjc-arc -x objective-c++ -c \
              -Iplatform/ios/src -Itests/staging "$unit" \
              -o "/tmp/pvz2-keyconv-ios-objects/${base}.o"
            file "/tmp/pvz2-keyconv-ios-objects/${base}.o"
          done
      - name: Syntax-check isolated KEYCONV Objective-C++ adapter for iPadOS arm64
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang++ -std=c++20 \
            -target arm64-apple-ios17.4 -isysroot "$SDK" \
            -fobjc-arc -x objective-c++ -fsyntax-only \
            -Wall -Wextra -Werror -pedantic \
            -Itests/staging tests/staging/keyconv_prelaunch_ios_adapter.mm
