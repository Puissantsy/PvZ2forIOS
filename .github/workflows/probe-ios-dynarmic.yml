name: Probe public iOS Dynarmic replacement (no IPA)

on:
  workflow_dispatch:
  push:
    branches: [research/world-key-conversion-active]
    paths:
      - ".github/workflows/probe-ios-dynarmic.yml"

permissions:
  contents: read

jobs:
  dependency-probe:
    runs-on: macos-15
    steps:
      - name: Checkout PvZ2 source
        uses: actions/checkout@v4

      - name: Clone Applesauce Dynarmic fork anonymously
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pvz2-dynarmic-probe
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= \
            clone --filter=blob:none \
            https://github.com/johnny901901901/dynarmic.git \
            /tmp/pvz2-dynarmic-probe
          cd /tmp/pvz2-dynarmic-probe
          echo "DYNARMIC_HEAD=$(git rev-parse HEAD)"
          echo "DYNARMIC_BRANCH=$(git branch --show-current)"
          git submodule status || true
          cat .gitmodules || true

      - name: Inspect iOS JIT source and API compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pvz2-dynarmic-probe
          test -f src/dynarmic/interface/A32/a32.h
          test -f src/dynarmic/interface/A32/config.h
          grep -R -n -E 'MAP_JIT|pthread_jit_write|TARGET_OS_IPHONE|__APPLE__' \
            src CMakeLists.txt CMakeModules 2>/dev/null | head -n 120 || true
          grep -q 'enable_cycle_counting' src/dynarmic/interface/A32/config.h
          grep -q 'check_halt_on_memory_access' src/dynarmic/interface/A32/config.h
          grep -q 'code_cache_size' src/dynarmic/interface/A32/config.h
          grep -q 'ClearExclusiveState' src/dynarmic/interface/A32/a32.h

      - name: Check PvZ2 iOS SpinLock patch compatibility
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pvz2-dynarmic-probe
          if git apply --check "$GITHUB_WORKSPACE/platform/ios/patches/dynarmic-ios-nontxm.patch"; then
            echo "PVZ2_SPINLOCK_PATCH=NEEDED_AND_APPLIES"
          elif grep -q 'TARGET_OS_IPHONE' src/dynarmic/common/spin_lock_arm64.cpp &&
               grep -q '__atomic_exchange_n' src/dynarmic/common/spin_lock_arm64.cpp; then
            echo "PVZ2_SPINLOCK_PATCH=ALREADY_EQUIVALENT"
          else
            echo "PVZ2_SPINLOCK_PATCH=INCOMPATIBLE"
            sed -n '1,150p' src/dynarmic/common/spin_lock_arm64.cpp
            exit 1
          fi
