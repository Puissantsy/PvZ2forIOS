name: v170 Global Ownership Safety Tests
on:
  push:
    paths:
      - "tests/staging/**"
      - "platform/ios/src/offline_global_transaction.hpp"
      - ".github/workflows/v170-global-policy-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp20-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual iOS C++20 policy header without iOS / APK / saves
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -Iplatform/ios/src -Itests/staging \
            tests/staging/test_offline_global_transaction.cpp \
            -o /tmp/test_offline_global_transaction
      - name: Run deterministic 10-SKU policy and journal checks
        run: /tmp/test_offline_global_transaction
      - name: Verify runtime source-stage and native saver call structure
        run: python3 tools/verify_v170_source_structure.py
