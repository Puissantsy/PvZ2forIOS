name: Build PvZ2 Inspector

on:
  workflow_dispatch:
  push:
    paths:
      - "inspector/**"
      - ".github/workflows/build-pvz2-inspector.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Configure Inspector
        run: |
          cmake -S inspector/ios -B build-inspector -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build unsigned arm64 Inspector
        run: |
          cmake --build build-inspector --config Release --target PvZ2Inspector -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect build
        run: |
          APP="$(find build-inspector -type d -name 'PvZ2Inspector.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "PvZ2Inspector.app was not produced"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          file "$APP/PvZ2Inspector"
          plutil -p "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          rm -rf inspector-package
          mkdir -p inspector-package/Payload
          cp -R "$APP" inspector-package/Payload/PvZ2Inspector.app
          (
            cd inspector-package
            zip -qry ../PvZ2Inspector-Lab-v1.2-unsigned.ipa Payload
          )
          shasum -a 256 PvZ2Inspector-Lab-v1.2-unsigned.ipa | tee PvZ2Inspector-Lab-v1.2-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PvZ2Inspector-Lab-v1.2-unsigned
          path: |
            PvZ2Inspector-Lab-v1.2-unsigned.ipa
            PvZ2Inspector-Lab-v1.2-unsigned.ipa.sha256
          if-no-files-found: error
