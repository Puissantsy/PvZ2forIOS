name: Build iOS JIT Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "platform/ios/**"
      - ".github/workflows/build-ios-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage public LiveExec32 Dynarmic bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .deps/liveexec32 .deps/liveexec32.tar.gz
          mkdir -p .deps/liveexec32
          curl -fL --retry 4 --retry-delay 2 --retry-all-errors \
            "https://codeload.github.com/LiveContainer/LiveExec32/tar.gz/refs/heads/main" \
            -o .deps/liveexec32.tar.gz
          ARCHIVE_SHA="$(shasum -a 256 .deps/liveexec32.tar.gz | awk '{print $1}')"
          tar -xzf .deps/liveexec32.tar.gz \
            --strip-components=1 -C .deps/liveexec32
          test -f .deps/liveexec32/lib/libdynarmic.a
          test -f .deps/liveexec32/include/dynarmic/interface/A32/a32.h
          file .deps/liveexec32/lib/libdynarmic.a
          echo "LIVEEXEC32_ARCHIVE_SHA256=$ARCHIVE_SHA"
          echo "PVZ2_DYNARMIC_ROOT=$GITHUB_WORKSPACE/.deps/liveexec32" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Install Dynarmic build dependency
        run: |
          brew list boost >/dev/null 2>&1 || brew install boost

      - name: Configure iOS project
        run: |
          cmake -S platform/ios -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DPVZ2_PREBUILT_DYNARMIC_ROOT="$PVZ2_DYNARMIC_ROOT" \
            -DBoost_INCLUDE_DIR="$(brew --prefix boost)/include"

      - name: Build unsigned arm64 app
        run: |
          cmake --build build-ios --config Release --target PvZ2forIOS -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect build
        run: |
          APP="$(find build-ios -type d -name 'PvZ2forIOS.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "PvZ2forIOS.app was not produced"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          file "$APP/PvZ2forIOS"
          plutil -p "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          rm -rf package
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/PvZ2forIOS.app
          (
            cd package
            zip -qry ../PvZ2forIOS-JIT-Probe-unsigned.ipa Payload
          )
          shasum -a 256 PvZ2forIOS-JIT-Probe-unsigned.ipa | tee PvZ2forIOS-JIT-Probe-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PvZ2forIOS-JIT-Probe-unsigned
          path: |
            PvZ2forIOS-JIT-Probe-unsigned.ipa
            PvZ2forIOS-JIT-Probe-unsigned.ipa.sha256
          if-no-files-found: error
