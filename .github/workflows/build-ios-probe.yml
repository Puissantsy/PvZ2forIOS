name: Build iOS JIT Probe

on:
  workflow_dispatch:
  push:
    paths:
      - "platform/ios/**"
      - ".github/workflows/build-ios-probe.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact Applesauce iOS Dynarmic revision
        shell: bash
        run: |
          set -euo pipefail
          DYN_URL="https://github.com/johnny901901901/dynarmic.git"
          DYN_SHA="f488f760c69c42a97331961e8e6c359b46ccc9e9"
          rm -rf .deps/dynarmic
          mkdir -p .deps
          GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone \
            "$DYN_URL" .deps/dynarmic
          (
            cd .deps/dynarmic
            git checkout --detach "$DYN_SHA"
            git submodule update --init --recursive
            test "$(git rev-parse HEAD)" = "$DYN_SHA"
            test -f src/dynarmic/interface/A32/a32.h
            test -f src/dynarmic/interface/A32/config.h
            grep -q 'TARGET_OS_IPHONE' src/dynarmic/common/spin_lock_arm64.cpp
            grep -q '__atomic_exchange_n' src/dynarmic/common/spin_lock_arm64.cpp

            # f488f760's physical-iOS CodeBlock enters an external JIT broker
            # with BRK #0xf00d. KEYCONV runs on A14/pre-TXM under StikDebug:
            # use one debugger-authorized RWX mapping. Do NOT toggle that same
            # mapping RX<->RW while Dynarmic's dispatcher is executing in it.
            python3 "$GITHUB_WORKSPACE/tools/patch_dynarmic_a14_nontxm.py" \
              "$PWD/externals/oaknut/include/oaknut/code_block.hpp"
            grep -q 'PVZ2_DYNARMIC_FORCE_NONTXM_JIT' externals/oaknut/include/oaknut/code_block.hpp
            grep -q 'PROT_READ | PROT_WRITE | PROT_EXEC' externals/oaknut/include/oaknut/code_block.hpp
            ! grep -q 'TARGET_OS_SIMULATOR || defined(PVZ2_DYNARMIC_FORCE_NONTXM_JIT)' externals/oaknut/include/oaknut/code_block.hpp
            echo "DYNARMIC_HEAD=$(git rev-parse HEAD)"
            echo "DYNARMIC_PVZ2_NONTXM_RWX_PATCH=applied"
          )
          echo "PVZ2_DYNARMIC_SOURCE_DIR=$GITHUB_WORKSPACE/.deps/dynarmic" >> "$GITHUB_ENV"

      - name: Verify KEYCONV A14 pre-TXM Dynarmic wiring
        run: python3 tools/verify_world_key_dynarmic_compat.py

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Install Dynarmic build dependency
        run: |
          brew list boost >/dev/null 2>&1 || brew install boost

      - name: Configure iOS project
        run: |
          cmake -S platform/ios -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DPVZ2_DYNARMIC_SOURCE_DIR="$PVZ2_DYNARMIC_SOURCE_DIR" \
            -DBoost_INCLUDE_DIR="$(brew --prefix boost)/include"

      - name: Build unsigned arm64 app
        run: |
          cmake --build build-ios --config Release --target PvZ2forIOS -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect build
        run: |
          APP="$(find build-ios -type d -name 'PvZ2forIOS.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "PvZ2forIOS.app was not produced"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          file "$APP/PvZ2forIOS"
          plutil -p "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          rm -rf package
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/PvZ2forIOS.app
          (
            cd package
            zip -qry ../PvZ2forIOS-JIT-Probe-unsigned.ipa Payload
          )
          shasum -a 256 PvZ2forIOS-JIT-Probe-unsigned.ipa | tee PvZ2forIOS-JIT-Probe-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PvZ2forIOS-JIT-Probe-unsigned
          path: |
            PvZ2forIOS-JIT-Probe-unsigned.ipa
            PvZ2forIOS-JIT-Probe-unsigned.ipa.sha256
          if-no-files-found: error
