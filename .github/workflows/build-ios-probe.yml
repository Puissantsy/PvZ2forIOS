name: Build KEYCONV automatic Egypt research IPA

on:
  workflow_dispatch:
  # Research branch updates run policy+Apple SDK checks, not full IPA builds.
  # A single explicitly dispatched IPA build or build-request marker is permitted after all gates pass.
  push:
    # This research branch requires ONE explicit source-marker commit to build.
    # Production main keeps its independent default-branch workflow intact.
    branches: [research/keyconv-auto-batch]
    paths:
      - "platform/ios/.auto-keyconv-build-request"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The upstream repository contains the SAME independently verified Git commit
      # SHA+tree as the historical LiveContainer fork, now unavailable to CI.
      # A successful checkout is cached under the exact proven SHA.
      # On cache hits reset to the *unpatched* commit before applying the
      # historical spinlock patch, preventing both drift and double-patching.
      - name: Cache exact historical Dynarmic checkout
        id: dynarmic-exact-source
        uses: actions/cache@v4
        with:
          path: .deps/dynarmic
          key: ${{ runner.os }}-pvz2-livecontainer-dynarmic-c97c525ec1432b1e5404ebf091027738005ec168-upstream-v2

      - name: Checkout exact proven LiveContainer Dynarmic revision
        shell: bash
        run: |
          set -euo pipefail
          DYN_URL="https://github.com/lioncash/dynarmic.git"
          DYN_SHA="c97c525ec1432b1e5404ebf091027738005ec168"
          if [ ! -d .deps/dynarmic/.git ]; then
            rm -rf .deps/dynarmic
            mkdir -p .deps
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= clone \
              "$DYN_URL" .deps/dynarmic
          else
            echo "PVZ2_DYNARMIC_SOURCE_CACHE=HIT"
          fi
          (
            cd .deps/dynarmic
            test "$(git remote get-url origin)" = "$DYN_URL"
            # Upstream still holds c97c, but its current cloned refs do not.
            # Explicit fetch retrieves the verified historical Git object.
            if ! git cat-file -e "$DYN_SHA^{commit}" 2>/dev/null; then
              GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch origin "$DYN_SHA"
            fi
            git checkout --detach "$DYN_SHA"
            git reset --hard "$DYN_SHA"
            git submodule update --init --recursive
            test "$(git rev-parse HEAD)" = "$DYN_SHA"
          # A Git commit SHA also fixes its entire tree. Refuse unrelated forks.
          test "$(git rev-parse HEAD^{tree})" = "fd5b3ab282948fcdacc202ee11ee6d7aec339125"
          test ! -f .gitmodules
            test -f src/dynarmic/interface/A32/a32.h
            test -f src/dynarmic/interface/A32/config.h

            # Match the already-proven KEYOBS/production dependency exactly:
            # LiveContainer c97c525e plus the project's historical iOS spinlock
            # patch. Do not patch its executable-memory allocator.
            git apply --check "$GITHUB_WORKSPACE/platform/ios/patches/dynarmic-ios-nontxm.patch"
            git apply "$GITHUB_WORKSPACE/platform/ios/patches/dynarmic-ios-nontxm.patch"

            DUAL=externals/oaknut/include/oaknut/dual_code_block.hpp
            grep -q 'm_xmem = (std::uint32_t\*)mmap(nullptr, size, PROT_READ | PROT_EXEC' "$DUAL"
            grep -q 'vm_remap(mach_task_self(), &wmem' "$DUAL"
            grep -q 'mprotect(m_wmem, size, PROT_READ | PROT_WRITE)' "$DUAL"
            grep -q 'if (DeviceHasTXM())' "$DUAL"
            grep -q 'JIT26PrepareRegion(m_xmem, m_size)' "$DUAL"

            echo "DYNARMIC_HEAD=$(git rev-parse HEAD)"
            echo "DYNARMIC_PVZ2_HISTORICAL_SOURCE=exact"
            echo "DYNARMIC_PVZ2_SPINLOCK_PATCH=applied"
          )
          echo "PVZ2_DYNARMIC_SOURCE_DIR=$GITHUB_WORKSPACE/.deps/dynarmic" >> "$GITHUB_ENV"

      - name: Check source provenance for reusable cache
        run: |
          test "$(git -C .deps/dynarmic rev-parse HEAD)" = "c97c525ec1432b1e5404ebf091027738005ec168"
          test "$(git -C .deps/dynarmic rev-parse HEAD^{tree})" = "fd5b3ab282948fcdacc202ee11ee6d7aec339125"
          echo "PVZ2_DYNARMIC_CACHE_KEY=exact-c97c525e-tree-fd5b3ab28294"


      - name: Verify KEYCONV historical Dynarmic wiring
        run: python3 tools/verify_world_key_dynarmic_compat.py

      - name: Show toolchain
        run: |
          xcodebuild -version
          cmake --version

      - name: Install Dynarmic build dependency
        run: |
          brew list boost >/dev/null 2>&1 || brew install boost

      - name: Configure iOS project
        run: |
          cmake -S platform/ios -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DPVZ2_DYNARMIC_SOURCE_DIR="$PVZ2_DYNARMIC_SOURCE_DIR" \
            -DBoost_INCLUDE_DIR="$(brew --prefix boost)/include"

      - name: Build unsigned arm64 app
        run: |
          cmake --build build-ios --config Release --target PvZ2forIOS -- \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Inspect build
        run: |
          APP="$(find build-ios -type d -name 'PvZ2forIOS.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "PvZ2forIOS.app was not produced"
            exit 1
          fi
          echo "APP=$APP" >> "$GITHUB_ENV"
          file "$APP/PvZ2forIOS"
          plutil -p "$APP/Info.plist"

      - name: Package unsigned IPA
        run: |
          rm -rf package
          mkdir -p package/Payload
          cp -R "$APP" package/Payload/PvZ2forIOS.app
          (
            cd package
            zip -qry ../PvZ2forIOS-KeyAuto-unsigned.ipa Payload
          )
          shasum -a 256 PvZ2forIOS-KeyAuto-unsigned.ipa | tee PvZ2forIOS-KeyAuto-unsigned.ipa.sha256

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PvZ2forIOS-KeyAuto-unsigned
          path: |
            PvZ2forIOS-KeyAuto-unsigned.ipa
            PvZ2forIOS-KeyAuto-unsigned.ipa.sha256
          if-no-files-found: error
